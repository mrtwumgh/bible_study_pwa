<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f2e8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16120e" media="(prefers-color-scheme: dark)">
  <title>Day unto Day</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <p class="brand">Day unto Day</p>

  <section id="view-today" class="view">
    <h1>Today</h1>
    <p class="sub">Your reading will appear here.</p>
  </section>

  <section id="view-journal" class="view" hidden>
    <h1>Journal</h1>
    <p class="sub">Your reflections will appear here.</p>
  </section>
</main>

<nav class="tabs" aria-label="Sections">
  <button data-tab="today" aria-current="page">Today</button>
  <button data-tab="journal">Journal</button>
</nav>

<script type="module" src="js/main.js"></script>
</body>
</html>
